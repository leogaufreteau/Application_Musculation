{% extends "base.html" %}
{% block title %}Progression{% endblock %}
{% block content %}
<h1>Progression</h1>

<label for="select-exercice">Choisir un exercice</label>
<select id="select-exercice">
    <option value="">— Sélectionner —</option>
    {% set groupe_courant = namespace(val=None) %}
    {% for ex in exercices %}
        {% if ex.groupe_musculaire != groupe_courant.val %}
            {% if not loop.first %}</optgroup>{% endif %}
            <optgroup label="{{ ex.groupe_musculaire }}">
            {% set groupe_courant.val = ex.groupe_musculaire %}
        {% endif %}
        <option value="{{ ex.id }}" {{ 'selected' if exercice_id == ex.id|string }}>{{ ex.nom }}</option>
        {% if loop.last %}</optgroup>{% endif %}
    {% endfor %}
</select>

<div id="chart-zone" style="display:none;">
    <div class="chart-wrap">
        <canvas id="chart-volume" height="220"></canvas>
    </div>
    <div id="rp-zone"></div>
</div>
<div id="empty-zone" class="empty-state">Choisis un exercice pour voir ta progression du volume total (poids × reps × séries) au fil du temps.</div>
{% endblock %}

{% block scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script>
let chart = null;

async function chargerProgression(exerciceId) {
    const chartZone = document.getElementById('chart-zone');
    const emptyZone = document.getElementById('empty-zone');
    if (!exerciceId) {
        chartZone.style.display = 'none';
        emptyZone.style.display = 'block';
        return;
    }
    const res = await fetch(`/api/progression/${exerciceId}`);
    const data = await res.json();

    chartZone.style.display = 'block';
    emptyZone.style.display = 'none';

    if (data.dates.length === 0) {
        document.getElementById('rp-zone').innerHTML = '<div class="empty-state">Pas encore de données enregistrées pour cet exercice.</div>';
        if (chart) { chart.destroy(); chart = null; }
        return;
    }

    const ctx = document.getElementById('chart-volume').getContext('2d');
    if (chart) chart.destroy();
    chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: data.dates,
            datasets: [{
                label: 'Volume total (kg)',
                data: data.volumes,
                borderColor: '#E4002B',
                backgroundColor: 'rgba(228,0,43,0.15)',
                borderWidth: 2,
                pointBackgroundColor: '#E4002B',
                tension: 0.25,
                fill: true,
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { labels: { color: '#F3F2F0' } }
            },
            scales: {
                x: { ticks: { color: '#9C9BA3' }, grid: { color: '#2C2C30' } },
                y: { ticks: { color: '#9C9BA3' }, grid: { color: '#2C2C30' }, beginAtZero: true }
            }
        }
    });

    const rpZone = document.getElementById('rp-zone');
    if (data.rp) {
        rpZone.innerHTML = `<div class="rp-display">RP : <b>${data.rp.poids} kg</b> (${data.rp.date})</div>`;
    } else {
        rpZone.innerHTML = `<div class="rp-display">Pas encore de RP enregistré pour cet exercice.</div>`;
    }
}

const select = document.getElementById('select-exercice');
select.addEventListener('change', () => chargerProgression(select.value));

if (select.value) {
    chargerProgression(select.value);
}
</script>
{% endblock %}
