{% extends "base.html" %}
{% block title %}Modifier la séance{% endblock %}
{% block content %}
<h1>Modifier la séance</h1>

<form method="POST" id="form-seance">
    <div class="field-row">
        <div>
            <label for="date">Date</label>
            <input type="date" id="date" name="date" value="{{ seance.date }}" required>
        </div>
    </div>
    <label for="notes">Notes générales (optionnel)</label>
    <textarea id="notes" name="notes">{{ seance.notes or '' }}</textarea>

    <h3>Exercices</h3>
    <div id="exos-container">
        {% for p in performances %}
        <div class="exo-row">
            <div class="exo-row-header">
                <strong>Exercice</strong>
                <button type="button" class="exo-remove" onclick="this.closest('.exo-row').remove()">✕</button>
            </div>
            <select name="exercice_id[]" required>
                <option value="">— Choisir un exercice —</option>
                {% for groupe, exercices in groupes.items() %}
                <optgroup label="{{ groupe }}">
                    {% for ex in exercices %}
                    <option value="{{ ex.id }}" {{ 'selected' if ex.id == p.exercice_id }}>{{ ex.nom }}</option>
                    {% endfor %}
                </optgroup>
                {% endfor %}
            </select>
            <div class="field-row">
                <div>
                    <label>Poids (kg)</label>
                    <input type="number" step="0.5" name="poids[]" value="{{ p.poids or '' }}" inputmode="decimal">
                </div>
                <div>
                    <label>Répétitions</label>
                    <input type="number" name="reps[]" value="{{ p.reps or '' }}" inputmode="numeric">
                </div>
                <div>
                    <label>Séries</label>
                    <input type="number" name="series[]" value="{{ p.series or '' }}" inputmode="numeric">
                </div>
            </div>
            <label>Ressenti</label>
            <select name="ressenti[]">
                <option value="">—</option>
                {% for i in range(1, 6) %}
                <option value="{{ i }}" {{ 'selected' if p.ressenti == i }}>{{ i }}{{ ' — Très facile' if i == 1 else ' — Facile' if i == 2 else ' — Modéré' if i == 3 else ' — Difficile' if i == 4 else ' — Très difficile' }}</option>
                {% endfor %}
            </select>
            <label>Commentaire (optionnel)</label>
            <textarea name="commentaire[]">{{ p.commentaire or '' }}</textarea>

            <input type="hidden" name="est_rp[]" value="{{ '1' if p.est_rp else '0' }}" class="rp-hidden">
            <div class="checkbox-row">
                <input type="checkbox" class="rp-checkbox" onchange="toggleRP(this)" {{ 'checked' if p.est_rp }}>
                <label>C'est un record personnel (RP) en 1 répétition</label>
            </div>
            <div class="rp-block" style="display:{{ 'block' if p.est_rp else 'none' }};">
                <label>Poids exact du RP (kg)</label>
                <input type="number" step="0.5" name="poids_rp[]" value="{{ p.poids_rp or '' }}">
            </div>
        </div>
        {% endfor %}
    </div>

    <button type="button" class="btn btn-ghost" id="btn-add-exo">＋ Ajouter un exercice</button>

    <div style="height:16px;"></div>
    <button type="submit" class="btn btn-primary">Enregistrer les modifications</button>
</form>

<template id="template-exo-row">
    <div class="exo-row">
        <div class="exo-row-header">
            <strong>Exercice</strong>
            <button type="button" class="exo-remove" onclick="this.closest('.exo-row').remove()">✕</button>
        </div>
        <select name="exercice_id[]" required>
            <option value="">— Choisir un exercice —</option>
            {% for groupe, exercices in groupes.items() %}
            <optgroup label="{{ groupe }}">
                {% for ex in exercices %}
                <option value="{{ ex.id }}">{{ ex.nom }}</option>
                {% endfor %}
            </optgroup>
            {% endfor %}
        </select>
        <div class="field-row">
            <div><label>Poids (kg)</label><input type="number" step="0.5" name="poids[]" inputmode="decimal"></div>
            <div><label>Répétitions</label><input type="number" name="reps[]" inputmode="numeric"></div>
            <div><label>Séries</label><input type="number" name="series[]" inputmode="numeric"></div>
        </div>
        <label>Ressenti</label>
        <select name="ressenti[]">
            <option value="">—</option>
            <option value="1">1 — Très facile</option>
            <option value="2">2 — Facile</option>
            <option value="3">3 — Modéré</option>
            <option value="4">4 — Difficile</option>
            <option value="5">5 — Très difficile</option>
        </select>
        <label>Commentaire (optionnel)</label>
        <textarea name="commentaire[]"></textarea>
        <input type="hidden" name="est_rp[]" value="0" class="rp-hidden">
        <div class="checkbox-row">
            <input type="checkbox" class="rp-checkbox" onchange="toggleRP(this)">
            <label>C'est un record personnel (RP) en 1 répétition</label>
        </div>
        <div class="rp-block" style="display:none;">
            <label>Poids exact du RP (kg)</label>
            <input type="number" step="0.5" name="poids_rp[]">
        </div>
    </div>
</template>
{% endblock %}

{% block scripts %}
<script>
function toggleRP(checkbox) {
    const row = checkbox.closest('.exo-row');
    const hidden = row.querySelector('.rp-hidden');
    const block = row.querySelector('.rp-block');
    hidden.value = checkbox.checked ? "1" : "0";
    block.style.display = checkbox.checked ? "block" : "none";
}
document.getElementById('btn-add-exo').addEventListener('click', () => {
    const tpl = document.getElementById('template-exo-row');
    const clone = tpl.content.cloneNode(true);
    document.getElementById('exos-container').appendChild(clone);
});
</script>
{% endblock %}
