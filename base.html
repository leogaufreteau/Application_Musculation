<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{% block title %}Suivi Muscu{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="topbar">
        <span class="topbar-mark">ON<span class="topbar-mark-accent">AIR</span></span>
        <span class="topbar-title">Suivi Muscu</span>
    </header>

    <main class="content">
        {% block content %}{% endblock %}
    </main>

    <nav class="bottomnav">
        <a href="{{ url_for('index') }}" class="navitem {{ 'active' if request.endpoint == 'index' }}">
            <span class="navicon">⌂</span><span>Accueil</span>
        </a>
        <a href="{{ url_for('nouvelle_seance') }}" class="navitem {{ 'active' if request.endpoint == 'nouvelle_seance' }}">
            <span class="navicon">＋</span><span>Séance</span>
        </a>
        <a href="{{ url_for('historique') }}" class="navitem {{ 'active' if request.endpoint == 'historique' }}">
            <span class="navicon">≡</span><span>Historique</span>
        </a>
        <a href="{{ url_for('graphiques') }}" class="navitem {{ 'active' if request.endpoint == 'graphiques' }}">
            <span class="navicon">⌁</span><span>Progrès</span>
        </a>
        <a href="{{ url_for('seances_types_liste') }}" class="navitem {{ 'active' if request.endpoint in ['seances_types_liste','nouvelle_seance_type','modifier_seance_type'] }}">
            <span class="navicon">☰</span><span>Types</span>
        </a>
    </nav>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
